    auth_request /_sim_museum_game_access;
    access_log off;
    limit_req zone=appdev_workspace_requests burst=4 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    client_body_timeout 5s;
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:24411;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host 127.0.0.1:24411;
    proxy_set_header Connection "";
    proxy_set_header Origin $http_origin;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Content-Length $content_length;
    include /etc/nginx/snippets/aster-codex-admission.private;
    proxy_read_timeout 15s;
