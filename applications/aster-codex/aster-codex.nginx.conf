location = /aster-codex { return 308 /aster-codex/; }
location = /aster-codex/sign-in { return 308 /aster-codex/; }

location = /workspace/sourcery-os/shared.css {
    alias /var/www/appdev-projects/workspace/browser-assets/sourcery-os.css;
    types {}
    default_type text/css;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    limit_except GET { deny all; }
}

location ^~ /aster-codex/ {
    auth_request /_sim_museum_game_access;
    error_page 401 = @appdev_workspace_sign_in;
    access_log off;
    limit_req zone=appdev_workspace_requests burst=30 nodelay;
    limit_req_status 429;
    limit_conn encounter_pilot_connections 12;
    limit_except GET { deny all; }
    include /etc/nginx/snippets/aster-codex-reader.conf;
}

location = /aster-codex/live {
    auth_request /_sim_museum_game_access;
    access_log off;
    limit_req zone=appdev_workspace_requests burst=12 nodelay;
    limit_req_status 429;
    limit_conn encounter_pilot_connections 8;
    limit_except GET { deny all; }
    gzip off;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:24411;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host 127.0.0.1:24411;
    proxy_set_header Connection "";
    proxy_set_header Content-Length "";
    include /etc/nginx/snippets/aster-codex-admission.private;
    proxy_read_timeout 115s;
}

location = /aster-codex/stop {
    include /etc/nginx/snippets/aster-codex-write.conf;
}
location = /aster-codex/send {
    include /etc/nginx/snippets/aster-codex-write.conf;
}
location = /aster-codex/pin {
    include /etc/nginx/snippets/aster-codex-write.conf;
}
